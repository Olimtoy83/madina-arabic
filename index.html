<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madina Arabic</title>
  <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button class="brand" id="home-button" type="button" aria-label="На главную">Madina Arabic</button>
      <div class="header-stats" aria-label="Ваш прогресс"><span>🔥 <strong id="streak-count">1</strong></span><span>✦ <strong id="xp-count">0</strong> XP</span><div class="language-switcher" role="group" aria-labelledby="language-label"><span id="language-label" class="visually-hidden">Язык</span><button id="locale-ru" type="button">Русский</button><button id="locale-uz" type="button">O‘zbekcha</button></div></div>
    </header>
    <main>
      <section id="home-screen" class="screen">
        <p class="eyebrow" id="home-eyebrow">Учимся понемногу каждый день</p>
        <h1 id="greeting"><span id="greeting-prefix">Ассаляму алейкум</span><span id="greeting-name" dir="auto" hidden></span></h1>
        <p class="intro" id="home-intro">Продолжайте знакомство с арабскими словами в своём темпе.</p>
        <section class="summary-card" aria-label="Общий прогресс">
          <div class="summary-heading"><span id="overall-label">Общий прогресс</span><strong id="overall-progress">0 / 12 слов</strong></div>
          <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="overall-progress-fill"></div></div>
          <p id="streak-description" class="muted">Серия: 1 день</p>
        </section>
        <button class="primary-button continue-button" id="continue-lesson" type="button">Продолжить урок</button>
        <section class="lessons-section" aria-labelledby="lessons-title">
          <div class="section-heading"><h2 id="lessons-title">Уроки</h2><span id="lesson-count" class="muted"></span></div>
          <div id="lesson-list" class="lesson-list"></div>
        </section>
      </section>
      <section id="lesson-screen" class="screen" hidden>
        <button class="back-button" id="back-to-home" type="button">← Все уроки</button>
        <div class="lesson-meta"><p id="lesson-kicker" class="eyebrow"></p><h1 id="lesson-title"></h1><p id="lesson-description" class="intro"></p></div>
        <nav id="topic-stage-nav" class="topic-stage-nav" aria-label="Этапы темы"></nav>
        <section class="lesson-progress" aria-label="Прогресс урока"><div class="summary-heading"><span id="lesson-progress-label">Прогресс урока</span><strong id="lesson-progress-count"></strong></div><div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="lesson-progress-fill"></div></div></section>
        <section class="word-card" id="word-card"><p id="word-position" class="word-position"></p><div class="word-illustration" id="word-illustration" hidden><img id="word-image" alt=""></div><h2 id="arabic-word" lang="ar" dir="rtl"></h2><p id="translation"></p><div class="pronunciation"><div class="audio-controls"><button class="audio-button" id="play-audio" type="button" aria-describedby="audio-status"><span aria-hidden="true">▶</span> <span id="audio-button-label">Прослушать произношение</span></button><div class="audio-rate" role="group" aria-labelledby="audio-rate-label"><span class="visually-hidden" id="audio-rate-label"></span><button class="audio-rate-option" id="audio-rate-normal" type="button" aria-pressed="true">1×</button><button class="audio-rate-option" id="audio-rate-slow" type="button" aria-pressed="false">0.75×</button></div></div><p class="audio-status" id="audio-status" role="status"></p></div><button class="soft-button" id="start-builder" type="button">🧩 Собрать слово</button></section>
        <section class="speak-stage-shell" id="speak-stage-shell" hidden aria-live="polite"><p class="eyebrow" id="speak-stage-kicker"></p><div class="speak-stage-card"><p class="speak-stage-position" id="speak-stage-position"></p><h2 class="speak-stage-phrase" id="speak-stage-phrase" lang="ar" dir="rtl"></h2><p class="speak-stage-meaning" id="speak-stage-meaning"></p><button class="speak-key" id="speak-key-trigger" type="button" aria-expanded="false" aria-controls="speak-key-details"><span class="speak-key-label" id="speak-key-label"></span><span class="speak-key-arabic" id="speak-key-arabic" lang="ar" dir="rtl"></span><span class="speak-key-meaning" id="speak-key-meaning"></span></button><section class="speak-key-details" id="speak-key-details" hidden aria-labelledby="speak-key-details-title"><h3 id="speak-key-details-title"></h3><p class="speak-key-details-arabic" id="speak-key-details-arabic" lang="ar" dir="rtl"></p><p class="speak-key-details-meaning" id="speak-key-details-meaning"></p><button class="secondary-button speak-key-close" id="speak-key-close" type="button"></button></section><button class="soft-button speak-practice-trigger" id="speak-practice-trigger" type="button"></button><section class="speak-assembly" id="speak-assembly" hidden aria-labelledby="speak-assembly-instruction"><p class="speak-assembly-instruction" id="speak-assembly-instruction"></p><div class="speak-assembly-answer" id="speak-assembly-answer" role="group"></div><div class="speak-assembly-options" id="speak-assembly-options" role="group"></div><p class="speak-assembly-feedback" id="speak-assembly-feedback" role="status"></p><div class="speak-assembly-actions"><button class="secondary-button" id="speak-assembly-reset" type="button"></button><button class="primary-button" id="speak-assembly-check" type="button" disabled></button></div></section><div class="speak-stage-actions"><button class="secondary-button" id="speak-previous" type="button"></button><button class="primary-button" id="speak-next" type="button"></button></div></div></section>
        <section class="expand-stage-shell" id="expand-stage-shell" hidden aria-live="polite"><p class="eyebrow" id="expand-stage-kicker"></p><div class="expand-stage-card"><p class="expand-stage-position" id="expand-stage-position"></p><section class="expand-part expand-base"><p class="expand-label" id="expand-base-label"></p><p class="expand-base-arabic" id="expand-base-arabic" lang="ar" dir="rtl"></p><p class="expand-meaning" id="expand-base-meaning"></p></section><section class="expand-part expand-added"><p class="expand-label" id="expand-added-label"></p><p class="expand-added-arabic" id="expand-added-arabic" lang="ar" dir="rtl"></p></section><section class="expand-part expand-phrase"><p class="expand-label" id="expand-phrase-label"></p><h2 class="expand-stage-phrase" id="expand-stage-phrase" lang="ar" dir="rtl"></h2><p class="expand-meaning" id="expand-stage-meaning"></p></section><button class="soft-button expand-practice-trigger" id="expand-practice-trigger" type="button"></button><section class="expand-assembly" id="expand-assembly" hidden aria-labelledby="expand-assembly-instruction"><p class="expand-assembly-instruction" id="expand-assembly-instruction"></p><div class="expand-assembly-answer" id="expand-assembly-answer" role="group"></div><div class="expand-assembly-options" id="expand-assembly-options" role="group"></div><p class="expand-assembly-feedback" id="expand-assembly-feedback" role="status"></p><div class="expand-assembly-actions"><button class="secondary-button" id="expand-assembly-reset" type="button"></button><button class="primary-button" id="expand-assembly-check" type="button" disabled></button></div></section><div class="expand-stage-actions"><button class="secondary-button" id="expand-previous" type="button"></button><button class="primary-button" id="expand-next" type="button"></button></div></div></section>
        <section class="understand-stage-shell" id="understand-stage-shell" hidden aria-live="polite"><p class="eyebrow" id="understand-stage-kicker"></p><div class="understand-stage-card"><p class="understand-stage-position" id="understand-stage-position"></p><section class="understand-part understand-question"><p class="understand-label" id="understand-question-label"></p><div class="understand-mode" role="group" aria-label=""><button class="understand-mode-option" id="understand-mode-read" type="button" aria-pressed="true"></button><button class="understand-mode-option" id="understand-mode-arabic" type="button" aria-pressed="false"></button><button class="understand-mode-option" id="understand-mode-choice" type="button" aria-pressed="false"></button></div><h2 class="understand-question-arabic" id="understand-question-arabic" lang="ar" dir="rtl"></h2><p class="understand-meaning" id="understand-question-meaning"></p><div class="understand-pronunciation"><div class="audio-controls"><button class="audio-button" id="understand-play-question" type="button" aria-describedby="understand-audio-status"><span aria-hidden="true">▶</span> <span id="understand-audio-button-label"></span></button><div class="audio-rate" role="group" aria-labelledby="understand-audio-rate-label"><span class="visually-hidden" id="understand-audio-rate-label"></span><button class="audio-rate-option" id="understand-audio-rate-normal" type="button" aria-pressed="true">1×</button><button class="audio-rate-option" id="understand-audio-rate-slow" type="button" aria-pressed="false">0.75×</button></div></div><p class="audio-status" id="understand-audio-status" role="status"></p></div><section class="understand-choice" id="understand-choice" hidden aria-labelledby="understand-choice-instruction"><p class="understand-choice-instruction" id="understand-choice-instruction"></p><div class="understand-choice-options" id="understand-choice-options" role="group" aria-describedby="understand-choice-feedback"></div><p class="understand-choice-feedback" id="understand-choice-feedback" role="status"></p><p class="understand-meaning understand-choice-answer" id="understand-choice-answer" hidden></p></section></section><section class="understand-part understand-answer"><p class="understand-label" id="understand-answer-label"></p><p class="understand-answer-arabic" id="understand-answer-arabic" lang="ar" dir="rtl"></p><p class="understand-meaning" id="understand-answer-meaning"></p></section><div class="understand-stage-actions"><button class="secondary-button" id="understand-previous" type="button"></button><button class="primary-button" id="understand-next" type="button"></button></div></div></section>
        <section class="builder-card" id="builder-card" hidden aria-live="polite"><p class="eyebrow" id="builder-eyebrow">Проверь себя</p><h2 id="builder-title">Собери слово</h2><div class="answer-slots" id="answer-slots" aria-label="Ваш ответ"></div><div class="letters" id="letters" aria-label="Буквы для выбора"></div><p class="builder-feedback" id="builder-feedback"></p><div class="builder-actions"><button class="secondary-button" id="reset-answer" type="button">Начать заново</button><button class="primary-button" id="check-answer" type="button" disabled>Проверить</button></div></section>
        <section class="learning-actions" id="learning-actions"><button class="primary-button" id="next-word" type="button">✓ Я знаю</button><button class="secondary-button" id="repeat-word" type="button">Повторить</button></section>
      </section>
    </main>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/data.js?v=10"></script>
  <script src="js/curriculum.js?v=2"></script>
  <script src="js/i18n.js?v=15"></script>
  <script src="js/telegram.js?v=5"></script>
  <script src="js/storage.js?v=8"></script>
  <script src="js/audio.js?v=1"></script>
  <script src="js/app.js?v=24"></script>
</body>
</html>
