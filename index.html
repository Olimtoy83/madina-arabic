<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madina Arabic</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="header">

      <div class="logo">
        🇸🇦 Madina Arabic
      </div>

      <div class="header-info">

        <div class="streak">
          🔥 0
        </div>

        <div class="day">
          Day 1
        </div>

      </div>

    </header>

    <section class="progress">

      <div class="progress-text">
        <span id="progress-count">1 / 5</span>
      </div>

      <div class="progress-bar">

        <div class="progress-fill" id="progress-fill"></div>

      </div>

    </section>

    <main>

      <section class="word-card">

        <h1 id="arabic-word"></h1>

        <p id="translation"></p>

        <button class="audio-btn" id="start-builder">
          🧩 Начать упражнение
        </button>

      </section>

      <section class="builder-card" id="builder-card" hidden>

        <h2>🧩 Собери слово</h2>

        <div class="answer-slots"></div>

        <div class="letters"></div>

      </section>

      <section class="actions">

        <button class="know-btn" id="next-word">
          ✅ Я знаю
        </button>

        <button class="repeat-btn">
          🔄 Повторить
        </button>

      </section>

    </main>

  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
