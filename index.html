<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madina Arabic</title>

  <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

  <div class="app">

    <header class="header">

      <div class="logo">
        🇸🇦 Madina Arabic
      </div>

      <div class="header-info">

        <div class="streak">
          🔥 <span id="streak-count">1</span>
        </div>

        <div class="day" id="day-count">
          Серия 1 дн.
        </div>

      </div>

    </header>

    <section class="progress">

      <div class="progress-text">
        <span id="progress-count">Освоено 0 / 5</span>
      </div>

      <div class="progress-bar">

        <div class="progress-fill" id="progress-fill"></div>

      </div>

    </section>

    <main>

      <section class="word-card">

        <h1 id="arabic-word"></h1>

        <p id="translation"></p>

        <button class="audio-btn" id="start-builder" type="button">
          🧩 Начать упражнение
        </button>

      </section>

      <section class="builder-card" id="builder-card" hidden aria-live="polite">

        <p class="eyebrow">Проверь себя</p>
        <h2>Собери слово</h2>

        <div class="answer-slots"></div>

        <div class="letters"></div>

        <p class="builder-feedback" id="builder-feedback"></p>

        <div class="builder-actions">
          <button class="secondary-btn" id="reset-answer" type="button">Начать заново</button>
          <button class="primary-btn" id="check-answer" type="button" disabled>Проверить</button>
        </div>

      </section>

      <section class="actions">

        <button class="know-btn" id="next-word" type="button">
          ✅ Я знаю
        </button>

        <button class="repeat-btn" id="repeat-word" type="button">
          🧩 Собрать слово
        </button>

      </section>

    </main>

  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="js/data.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
